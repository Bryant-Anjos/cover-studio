# Builds the static site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Pages → Custom domain: capa.briam.cloud  (then tick "Enforce HTTPS")
#   DNS for briam.cloud:  CNAME capa → bryant-anjos.github.io.
#     (Cloudflare: keep that record "DNS only" / grey cloud, or use SSL mode
#      "Full" if you proxy it.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
